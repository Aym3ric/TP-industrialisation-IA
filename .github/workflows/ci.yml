# Intégration continue : lint + tests à chaque push et pull request.
# Réutilisé par release.yml (workflow_call) : aucune image n'est publiée si la CI échoue.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**", release, hotfix]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v

  docker:
    name: Build Docker (sans publication)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construit l'image de prod : le stage `test` (lint, tests, entraînement,
      # prédiction de fumée) s'exécute au passage. Rien n'est poussé.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
