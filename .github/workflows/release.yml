# CI/CD de release : à chaque push sur la branche release (cf. GitFlow), on teste
# puis on construit et publie l'image sur ghcr.io.
#
#   1. Déclenchement de la CI/CD
#   2. Checkout du projet
#   3. Initialisation Python
#   4. pytest et pylint
#   5. Authentification à GitHub Container Registry
#   6. Docker Build
#   7. Docker Push sur ghcr.io
#
# Chaque étape ne s'exécute que si la précédente a réussi : une release dont les tests
# ou le lint échouent ne produit aucune image.
name: Release Docker

# 1. Déclenchement de la CI/CD
on:
  push:
    branches:
      - release
      - "release/**"

jobs:
  release:
    name: Test, build & push ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io avec GITHUB_TOKEN

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      # 2. Checkout du projet
      - name: Checkout du projet
        uses: actions/checkout@v4

      # 3. Initialisation Python
      - name: Initialisation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt pylint

      # 4. pytest et pylint
      - name: pytest
        run: pytest -v

      # --exit-zero : le rapport et la note s'affichent dans les logs, mais les messages
      # pylint ne bloquent pas la publication de l'image.
      - name: pylint
        run: pylint src --exit-zero

      # 5. Authentification à GitHub Container Registry
      # GITHUB_TOKEN suffit pour publier dans le registre du propriétaire du dépôt :
      # pas besoin de Personal Access Token pour ce cas simple.
      - name: Authentification à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker Build
      # Une branche release est une version candidate : pré-version Semantic Versioning
      # X.Y.Z-rc.N, avec X.Y.Z lu dans pyproject.toml et N le numéro d'exécution
      # (unique et croissant). Ex. : 0.1.0-rc.12.
      # Le tag `release` désigne toujours la dernière image de la branche.
      # `latest` est réservé à main. ghcr.io exige un nom d'image en minuscules.
      - name: Docker Build
        run: |
          BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"
          IMAGE="${IMAGE,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          docker build --target prod \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:release" \
            .

      # 7. Docker Push sur ghcr.io
      - name: Docker Push sur ghcr.io
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:release"
